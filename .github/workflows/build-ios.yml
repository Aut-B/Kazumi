name: "Build for iOS"

on:
  workflow_dispatch:

jobs:
  flutter-build-ios:
    name: "Build iOS unsigned IPA"
    runs-on: "macos-latest"
    permissions:
      contents: read
      actions: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Install native build tools
        run: brew install cmake ninja
      - name: Disable code signing
        run: |
          python3 - <<'PY'
          import io, re
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          src = io.open(path, encoding='utf-8').read()
          automatic = src.count('CODE_SIGN_STYLE = Automatic')
          src = src.replace('CODE_SIGN_STYLE = Automatic', 'CODE_SIGN_STYLE = Manual')
          src = re.sub(
              r'"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";',
              src,
          )
          src = src.replace('DEVELOPMENT_TEAM = "";', '')
          io.open(path, 'w', encoding='utf-8').write(src)
          print('CODE_SIGN_STYLE switched to Manual:', automatic)
          PY
          grep -c "CODE_SIGN_STYLE = Manual" ios/Runner.xcodeproj/project.pbxproj || true
      - name: Build IPA
        # CI 上没有开发者账号：Flutter 会因为没有 Development Team 而在收尾阶段报错，
        # 但 Runner.app 此时已经构建完成，产物本身就是未签名的，照常打包即可。
        run: flutter build ios --release --no-codesign || true
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: "-"
          EXPANDED_CODE_SIGN_IDENTITY: "-"
      - name: Create IPA
        run: |
          ls -la build/ios/iphoneos/
          test -d build/ios/iphoneos/Runner.app
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -q -r Kazumi_ios_PiP_unsigned.ipa Payload
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios_pip_outputs
          path: Kazumi_ios_*.ipa

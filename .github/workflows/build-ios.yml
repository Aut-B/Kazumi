name: "Build for iOS"

on:
  workflow_dispatch:

jobs:
  flutter-build-ios:
    name: "Build iOS unsigned IPA"
    runs-on: "macos-latest"
    permissions:
      contents: read
      actions: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Install native build tools
        run: brew install cmake ninja
      - name: Disable code signing
        run: |
          python3 - <<'PY'
          import io, re
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          src = io.open(path, encoding='utf-8').read()
          automatic = src.count('CODE_SIGN_STYLE = Automatic')
          src = src.replace('CODE_SIGN_STYLE = Automatic', 'CODE_SIGN_STYLE = Manual')
          src = re.sub(
              r'"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";',
              src,
          )
          src = src.replace('DEVELOPMENT_TEAM = "";', '')
          io.open(path, 'w', encoding='utf-8').write(src)
          print('CODE_SIGN_STYLE switched to Manual:', automatic)
          PY
          grep -c "CODE_SIGN_STYLE = Manual" ios/Runner.xcodeproj/project.pbxproj || true
      - name: Build IPA
        # CI 上没有开发者账号。先按常规流程构建；若 Xcode 因为缺少 Development Team
        # 拒绝收尾，则直接用 xcodebuild 构建——命令行参数的优先级高于工程设置，
        # 可以彻底关掉签名。产物本就是未签名的 IPA。
        run: |
          flutter build ios --release --no-codesign -v > build.log 2>&1 || true
          grep -E "error:|requires a development team" build.log | head -20 || true
          grep -n "CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj | head -5 || true
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "Fallback: 用 xcodebuild 直接构建"
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Release -sdk iphoneos -arch arm64 \
              -derivedDataPath build/ios/iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual \
              build
          fi
      - name: Create IPA
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 5 -type d -name "Runner.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/Runner.app
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -q -r Kazumi_ios_PiP_unsigned.ipa Payload
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios_pip_outputs
          path: Kazumi_ios_*.ipa
